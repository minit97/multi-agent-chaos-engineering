  <text x="488" y="447" font-size="17" fill="#232F3E" text-anchor="start" font-weight="700" font-family="Apple SD Gothic Neo, Pretendard, Noto Sans KR, Malgun Gothic, sans-serif">실험 시작 (장애 주입)</text>
