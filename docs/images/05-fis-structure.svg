  <rect width="1500" height="900" fill="#FFFFFF"/>
  <text x="750.0" y="58" font-size="34" fill="#232F3E" text-anchor="middle" font-weight="700" font-family="Apple SD Gothic Neo, Pretendard, Noto Sans KR, Malgun Gothic, sans-serif">AWS FIS: 실험 템플릿의 3요소와 실행 흐름</text>
  <text x="750.0" y="92" font-size="18" fill="#687078" text-anchor="middle" font-weight="400" font-family="Apple SD Gothic Neo, Pretendard, Noto Sans KR, Malgun Gothic, sans-serif">장애를 코드로 선언하면 AWS가 주입과 원복을 대신 수행한다</text>
