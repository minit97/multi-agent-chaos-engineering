  <text x="848" y="521" font-size="14" fill="#FF9900" text-anchor="middle" font-weight="700" font-family="Apple SD Gothic Neo, Pretendard, Noto Sans KR, Malgun Gothic, sans-serif">개선 후 다시 실험</text>
  <rect x="60" y="566" width="1380" height="148" rx="12" fill="#FDF0EE" stroke="#D13212" stroke-width="2.5"/>
  <text x="84" y="600" font-size="19" fill="#232F3E" text-anchor="start" font-weight="700" font-family="Apple SD Gothic Neo, Pretendard, Noto Sans KR, Malgun Gothic, sans-serif">우리 코드의 실제 설정 (정직하게)</text>
  <text x="84" y="634" font-size="16" fill="#D13212" text-anchor="start" font-weight="700" font-family="SFMono-Regular, Menlo, monospace">stopConditions=[{"source": "none"}]   ← 중단 조건을 걸지 않았다</text>
  <text x="84" y="666" font-size="16" fill="#4A5561" text-anchor="start" font-weight="400" font-family="Apple SD Gothic Neo, Pretendard, Noto Sans KR, Malgun Gothic, sans-serif">FIS가 제공하는 안전장치 중 가장 중요한 것을 아직 쓰지 않고 있다. 지금은 실행 전 검증으로만 막는다.</text>
  <text x="84" y="694" font-size="16" fill="#687078" text-anchor="start" font-weight="400" font-family="Apple SD Gothic Neo, Pretendard, Noto Sans KR, Malgun Gothic, sans-serif">CloudWatch 알람 기반 Stop Condition 자동 생성이 다음 과제다.</text>
  <rect x="60" y="738" width="1380" height="120" rx="12" fill="#F7F8F8" stroke="#D5DBDB" stroke-width="2"/>
  <text x="84" y="772" font-size="18" fill="#232F3E" text-anchor="start" font-weight="700" font-family="Apple SD Gothic Neo, Pretendard, Noto Sans KR, Malgun Gothic, sans-serif">우리 파이프라인이 실제로 호출하는 FIS API</text>
  <text x="84" y="806" font-size="16" fill="#232F3E" text-anchor="start" font-weight="400" font-family="SFMono-Regular, Menlo, monospace">fis.list_actions()  ·  fis.create_experiment_template()</text>
  <text x="84" y="836" font-size="15" fill="#687078" text-anchor="start" font-weight="400" font-family="Apple SD Gothic Neo, Pretendard, Noto Sans KR, Malgun Gothic, sans-serif">fis.start_experiment() / fis.get_experiment() 은 함수로 정의했으나 에이전트에 연결하지 않았다 (미실행)</text>
