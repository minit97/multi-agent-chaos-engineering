  <text x="1204" y="447" font-size="17" fill="#232F3E" text-anchor="start" font-weight="700" font-family="Apple SD Gothic Neo, Pretendard, Noto Sans KR, Malgun Gothic, sans-serif">자동 종료 및 원복</text>
